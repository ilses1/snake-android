name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 发 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node（assets 自检用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 注意：这里刻意不使用 android-actions/setup-android。
      # 它默认会安装 legacy 的 `tools` 包，而该包已被 Google 从 SDK 仓库下架，
      # 会导致 "Failed to find package 'tools'" 直接失败（2026-09 起多发）。
      # ubuntu runner 镜像本身就预装了 Android SDK，含 android-35 与 build-tools 34/35，够用。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK = $SDK"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
            echo "sdkmanager = $SDKMGR"
          else
            echo "::warning::找不到 sdkmanager，若组件齐全则不影响构建"
          fi

          # 预装齐了就完全不碰网络；缺了才补装（这样 runner 镜像变动时也不会挂）
          missing=()
          for p in "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"; do
            [ -d "$SDK/${p//;/\/}" ] || missing+=("$p")
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "缺少组件：${missing[*]} → 补装"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "${missing[@]}"
          else
            echo "预装组件齐备（${#missing[@]} 项缺失），跳过安装"
          fi

          echo "--- platforms ---";   ls "$SDK/platforms"
          echo "--- build-tools ---"; ls "$SDK/build-tools"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 校验 assets（离线依赖 / 桥接补丁 / 语法）
        run: node tools/check-web-assets.mjs

      - name: 构建 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/snake-android-${GITHUB_REF_NAME}-debug.apk"
          ls -la dist/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-android-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 附到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
